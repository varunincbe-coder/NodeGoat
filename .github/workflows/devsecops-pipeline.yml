name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test
        continue-on-error: false

  sast-scan:
    name: "Gate 1: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        env:
          SEMGREP_RULES: p/owasp-top-ten
        # This gate fails the build on any ERROR-severity finding.
        # To demonstrate a real block, reintroduce a known-bad pattern
        # (e.g. string-concatenated Mongo query) on a feature branch.

  dependency-scan:
    name: "Gate 2: Dependency / SCA Scan"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        # Fails the job (non-zero exit) if any high/critical vulnerable
        # dependency is found. This is your "genuinely fails" gate --
        # capture a run where an outdated package trips this.

  secrets-scan:
    name: "Gate 3: Secrets Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails automatically if a secret pattern (API key, connection
        # string, etc.) is detected anywhere in the scanned history.

  container-scan:
    name: "Gate 4: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nodegoat:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nodegoat:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # exit-code 1 = job fails if CRITICAL/HIGH vulnerabilities
          # are found in the built image. This is a strong candidate
          # for your "gate genuinely blocks a build" evidence.
  dast-scan:
     name: "Optional: DAST (OWASP ZAP)"
     runs-on: ubuntu-latest
     needs: [sast-scan, dependency-scan, secrets-scan, container-scan]
     steps:
       - name: Checkout code
         uses: actions/checkout@v4
       - name: Start application via docker-compose
         run: docker compose up -d
       - name: Run ZAP baseline scan
         uses: zaproxy/action-baseline@v0.12.0
         with:
           target: 'http://localhost:4000'
