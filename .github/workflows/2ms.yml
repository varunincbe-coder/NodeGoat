name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  twoms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository (target)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout 2MS source (with SARIF fix)
        uses: actions/checkout@v4
        with:
          repository: varunincbe-coder/2ms-updated
          ref: AST-000-fix-codecov
          path: 2ms-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 2ms-src/go.mod

      - name: Build 2MS
        working-directory: 2ms-src
        run: go build -o /tmp/2ms .

      - name: Run 2MS
        run: |
          mkdir -p target/artifacts
          /tmp/2ms git target \
            --report-path target/artifacts/2ms.json \
            --report-path target/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Generate summary
        run: node target/scripts/summarize_2ms.js target/artifacts/2ms.json

      - name: Upload 2MS SARIF (Code Scanning)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/artifacts/2ms.sarif
          checkout_path: target

      - name: Setup reviewdog
        if: always()
        uses: reviewdog/action-setup@v1

      - name: Post 2MS findings as annotations
        if: always()
        working-directory: target
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/2ms-to-reviewdog.js artifacts/2ms.json | \
            reviewdog -efm="%f:%l:%c:%m" \
              -name="2MS" \
              -reporter=github-check \
              -filter-mode=nofilter \
              -level=error \
              -fail-on-error=false


