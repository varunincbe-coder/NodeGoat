name: 2ms - Secrets Scan

on:
  push:
    branches: [CheckMarx-Demo, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: 2ms Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2ms secret scan
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD":/repo --user "$(id -u):$(id -g)" -e HOME=/tmp checkmarx/2ms \
            git /repo \
            --report-path /repo/artifacts/2ms.json \
            --ignore-on-exit results

      - name: Generate summary
        run: node scripts/summarize_2ms.js artifacts/2ms.json
