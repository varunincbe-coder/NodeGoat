name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  twoms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo:ro \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --ignore-on-exit results \
            > 2ms.sarif

      - name: Check 2MS report
        if: always()
        run: |
          echo "SARIF file:"
          ls -lh 2ms.sarif
          echo "SARIF size:"
          wc -c 2ms.sarif
          echo "First 20 lines:"
          head -20 2ms.sarif

      - name: Upload 2MS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 2ms.sarif
