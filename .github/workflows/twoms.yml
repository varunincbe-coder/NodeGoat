name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  twoms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 2MS report directory
        run: |
          mkdir -p "$RUNNER_TEMP/2ms"
          chmod 777 "$RUNNER_TEMP/2ms"

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$RUNNER_TEMP/2ms":/output \
            checkmarx/2ms \
            filesystem \
            --path /repo \
            --stdout-format sarif \
            --report-path /output/2ms.sarif \
            --ignore-on-exit results

      - name: Inspect 2MS SARIF
        if: always()
        run: |
          echo "=== 2MS directory ==="
          ls -lah "$RUNNER_TEMP/2ms"

          echo "=== SARIF files ==="
          find "$RUNNER_TEMP/2ms" -type f -name "*.sarif" -print

          echo "=== SARIF size ==="
          wc -c "$RUNNER_TEMP/2ms/2ms.sarif"

      - name: Copy SARIF into workspace
        if: always()
        run: |
          cp "$RUNNER_TEMP/2ms/2ms.sarif" ./2ms.sarif
          ls -lh ./2ms.sarif

      - name: Upload 2MS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 2ms.sarif
          category: 2ms
