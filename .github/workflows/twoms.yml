name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  twoms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 2MS report directory
        run: |
          mkdir -p "$RUNNER_TEMP/2ms"
          chmod 777 "$RUNNER_TEMP/2ms"

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$RUNNER_TEMP/2ms":/output \
            checkmarx/2ms \
            filesystem \
            --path /repo \
            --stdout-format sarif \
            --report-path /output/2ms.sarif \
            --ignore-on-exit results



      - name: Inspect 2MS SARIF
        if: always()
        run: |
          echo "=== 2MS directory ==="
          ls -lah "$RUNNER_TEMP/2ms"

          echo "=== SARIF files ==="
          find "$RUNNER_TEMP/2ms" -type f -name "*.sarif" -print

          echo "=== SARIF size ==="
          wc -c "$RUNNER_TEMP/2ms/2ms.sarif"

      - name: Copy SARIF into workspace
        if: always()
        run: |
          cp "$RUNNER_TEMP/2ms/2ms.sarif" ./2ms.sarif
          ls -lh ./2ms.sarif

      - name: Inspect 2MS findings
        if: always()
        run: |
          python - <<'PY'
          import json
      
          with open("2ms.sarif", "r") as f:
              data = json.load(f)
      
          for run in data.get("runs", []):
              tool = run.get("tool", {}).get("driver", {})
              results = run.get("results", [])
      
              print("=== 2MS SARIF ===")
              print("Tool:", tool.get("name"))
              print("Rules:", len(tool.get("rules", [])))
              print("Results:", len(results))
      
              for i, result in enumerate(results, 1):
                  print(f"\nFinding {i}")
                  print("Rule:", result.get("ruleId"))
                  print("Message:", result.get("message", {}).get("text"))
      
                  locations = result.get("locations", [])
                  for location in locations:
                      physical = location.get("physicalLocation", {})
                      artifact = physical.get("artifactLocation", {})
                      region = physical.get("region", {})
      
                      print("File:", artifact.get("uri"))
                      print("Line:", region.get("startLine"))
          PY

      - name: Upload 2MS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 2ms.sarif
          category: 2ms
