name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  2ms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --report-path /repo/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Inspect 2MS output
        if: always()
        run: |
          echo "=== Workspace ==="
          pwd
          ls -la

          echo "=== Artifacts ==="
          ls -la artifacts || true

          echo "=== SARIF files ==="
          find . -name "*.sarif" -type f -print
