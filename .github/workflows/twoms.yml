name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  twoms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create report directory
        run: |
          mkdir -p "$RUNNER_TEMP/2ms"
          chmod 777 "$RUNNER_TEMP/2ms"

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v "$RUNNER_TEMP/2ms":/output \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --report-path /output/2ms.sarif \
            --ignore-on-exit results

      - name: Copy SARIF
        if: always()
        run: |
          cp "$RUNNER_TEMP/2ms/2ms.sarif" ./2ms.sarif

      - name: Inspect SARIF
        if: always()
        run: |
          python - <<'PY'
          import json

          with open("2ms.sarif") as f:
              data = json.load(f)

          print("SARIF version:", data.get("version"))

          for run in data.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              results = run.get("results", [])

              print("Tool:", driver.get("name"))
              print("Rules:", len(driver.get("rules", [])))
              print("Results:", len(results))

              for result in results:
                  print()
                  print("Rule:", result.get("ruleId"))
                  print("Message:", result.get("message", {}).get("text"))

                  for location in result.get("locations", []):
                      artifact = (
                          location
                          .get("physicalLocation", {})
                          .get("artifactLocation", {})
                      )

                      print("URI:", artifact.get("uri"))
                      print("URI base:", artifact.get("uriBaseId"))
          PY

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 2ms.sarif
          category: 2ms
