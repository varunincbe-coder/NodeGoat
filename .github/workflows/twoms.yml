name: 2MS - Secret Scan

on:
  workflow_dispatch:

jobs:
  twoms:
    name: 2MS Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --report-path /repo/2ms.sarif \
            --ignore-on-exit results

      - name: Check 2MS report
        if: always()
        run: |
          echo "Current directory:"
          pwd

          echo "Files in workspace:"
          ls -lah

          echo "Looking for SARIF:"
          find . -name "*.sarif" -type f -print

      - name: Upload 2MS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 2ms.sarif
