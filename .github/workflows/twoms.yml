name: 2MS Secret Scan
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2MS Scan
        run: |
          mkdir -p artifacts
          docker run -v $(pwd):/repo checkmarx/2ms:5.4.0 \
            --ignore-on-exit results \
            --report-path /repo/artifacts/twoms.sarif \
            git /repo

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/twoms.sarif
